<!--
  Paste this into a Code Block on the Squarespace page. Change the one URL on
  the first line of the script to wherever try/index.html is hosted.

  Class names are prefixed so nothing here collides with a Squarespace theme,
  and there is no <style> outside this block for the same reason.
-->

<style>
  .here-demo { max-width: 393px; margin: 0 auto; }
  .here-demo .here-frame {
    border-radius: 34px; background: #000; padding: 8px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.16);
  }
  .here-demo iframe {
    display: block; width: 100%; height: 760px; border: 0; border-radius: 27px;
    background: #f6f5f2;
  }
  @media (max-width: 480px) { .here-demo iframe { height: 620px; } }
  .here-demo .here-actions {
    display: flex; flex-wrap: wrap; gap: 0.6rem 1rem;
    align-items: center; justify-content: center; margin-top: 0.9rem;
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .here-demo .here-open {
    font-size: 0.92rem; font-weight: 600; text-decoration: none;
    color: #17606b; background: rgba(23,96,107,0.10);
    border-radius: 999px; padding: 0.55rem 1.1rem;
  }
  .here-demo .here-restart {
    font: inherit; font-size: 0.85rem; color: #6b6862; background: none;
    border: 0; cursor: pointer; padding: 0.3rem; text-decoration: underline;
  }
</style>

<div class="here-demo">
  <div class="here-frame">
    <iframe id="here-app" title="Here, running in your browser" loading="lazy"></iframe>
  </div>
  <div class="here-actions">
    <a class="here-open" id="here-open" target="_blank" rel="noopener">Open it full screen ↗</a>
    <button type="button" class="here-restart" id="here-restart">Start again from the beginning</button>
  </div>
</div>

<script>
  var HERE_APP_URL = 'PASTE_YOUR_APP_URL_HERE';

  (function () {
    var frame = document.getElementById('here-app');
    var open = document.getElementById('here-open');
    frame.src = HERE_APP_URL;
    open.href = HERE_APP_URL;

    /*
     * Starting over.
     *
     * The app keeps its state in the browser, so starting again means clearing
     * it — and this page cannot reach into the frame to do that, because the
     * app is served from another domain. That is a security rule and not
     * something to work around.
     *
     * What this page can do is point the frame somewhere new. The demo build
     * reads `?reset` on the way up and clears storage itself. The counter is
     * there so the second press is a different address from the first;
     * without it the browser treats it as the same page and does nothing.
     */
    var n = 0;
    document.getElementById('here-restart').addEventListener('click', function () {
      frame.src = HERE_APP_URL + '?reset=' + ++n;
    });
  })();
</script>
